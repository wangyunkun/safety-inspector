function buildRiskCard(item,index,taskId){
  const st=RISK_STYLE[item.risk_level]||RISK_STYLE['一般质量缺陷'];
  const issueShort=(item.issue||'').length>80?(item.issue||'').slice(0,80)+'...':(item.issue||'');

  // 多专家标签渲染
  const experts = item._experts && item._experts.length > 0 ? item._experts : (item.category ? [item.category] : []);
  const isMultiExpert = experts.length > 1;
  const EXPERT_COLORS = {
    '安全':'#7C3AED','机械':'#1D4ED8','消防':'#B91C1C','土建':'#065F46',
    '机电':'#0369A1','结构':'#9A3412','电气':'#92400E','基坑':'#155E75',
    '边坡':'#14532D','隧洞':'#3B0764','水利':'#1E3A5F','给排水':'#134E4A',
    '环保':'#166534','管道':'#831843'
  };
  const expertTagsHTML = experts.map(exp => {
    const color = EXPERT_COLORS[exp] || '#374151';
    return `<span style="display:inline-flex;align-items:center;background:${color};color:#fff;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;">${exp}</span>`;
  }).join('');
  const multiExpertBadge = isMultiExpert
    ? `<span style="display:inline-flex;align-items:center;gap:3px;background:linear-gradient(90deg,#7C3AED,#1D4ED8);color:#fff;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;">🔁 ${experts.length}专家确认</span>`
    : '';

  const card=document.createElement('div');
  card.className='risk-card fade-in';
  card.style.cssText=`background:${st.bg};border-color:${st.border}${isMultiExpert?';box-shadow:0 2px 12px rgba(124,58,237,0.15)':''}`;
  card.innerHTML=`
    <div class="card-header">
      <div class="card-num" style="background:${st.border}">${index}</div>
      <div class="card-badge" style="background:${st.border}">${st.icon} ${item.risk_level}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">${expertTagsHTML}${multiExpertBadge}</div>
      <div class="card-actions">
        <button class="card-btn btn-edit">编辑</button>
        <button class="card-btn btn-copy-card">复制</button>
        <button class="card-btn btn-delete">删除</button>
      </div>
    </div>
    <div style="font-size:10px;color:var(--text-hint);margin:-2px 0 6px">编号：${escHtml(item.issue_id||createIssueId(item))}${item.evidence_location?` · 证据位置：${escHtml(item.evidence_location)}`:''}${item.evidence_status==='需现场复核'?` · <span style="color:#92400E;font-weight:700">需现场复核</span>`:''}</div>
    <div class="card-issue">${escHtml(issueShort)}</div>
    <div class="rect-status-bar">
      <span style="font-size:11px;color:var(--text-hint);flex-shrink:0">整改：</span>
      <button class="rect-btn rect-pending ${!item.rectStatus||item.rectStatus==='pending'?'active':''}" onclick="setRectStatus(event,this,'pending','${taskId}')">待整改</button>
      <button class="rect-btn rect-ongoing ${item.rectStatus==='ongoing'?'active':''}" onclick="setRectStatus(event,this,'ongoing','${taskId}')">整改中</button>
      <button class="rect-btn rect-done ${item.rectStatus==='done'?'active':''}" onclick="setRectStatus(event,this,'done','${taskId}')">已完成</button>
    </div>
    <div class="card-hint">💬 点击查看详情</div>
    ${(item._corpViolations && item._corpViolations.length) ? `
    <div style="margin-top:6px;padding:5px 8px;background:rgba(220,38,38,0.08);border-left:3px solid #DC2626;border-radius:0 6px 6px 0;display:flex;align-items:center;gap:6px">
      <span style="font-size:13px">🏢</span>
      <span style="font-size:11px;font-weight:700;color:#DC2626">违反企业内规</span>
      <span style="font-size:11px;color:#DC2626;opacity:.8">${item._corpViolations.map(v=>v.id+'条').join('、')}</span>
    </div>` : ''}
    ${item.regulation||item.correction?'<hr class="card-divider">':''}
    <div class="card-footer">
      <div style="display:flex;gap:8px">${item.regulation?'<span style="font-size:11px;color:var(--text-hint)">📋 有规范依据</span>':''}${item.correction?'<span style="font-size:11px;color:var(--text-hint)">✅ 有整改措施</span>':''}</div>
      ${item.confidence?`<span class="card-conf">置信度${Math.round(item.confidence*100)}%</span>`:''}
    </div>`;
  card._item=item;card._taskId=taskId;
  card.querySelector('.btn-edit').onclick=e=>{e.stopPropagation();openEdit(item,taskId);};
  card.querySelector('.btn-copy-card').onclick=e=>{e.stopPropagation();copyIssue(item);};
  card.querySelector('.btn-delete').onclick=e=>{e.stopPropagation();deleteIssue(item,taskId);};
  card.addEventListener('click',()=>showIssueDetail(item));
  return card;
}

function setRectStatus(e,btn,status,taskId){
  e.stopPropagation();
  const card=btn.closest('.risk-card');
  if(!card||!card._item) return;
  card._item.rectStatus=status;
  card.querySelectorAll('.rect-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const labels={'pending':'待整改','ongoing':'整改中','done':'✅ 已完成'};
  showToast(labels[status]||status);
}
function openEdit(item,taskId){
  editingItem=item;editingTaskId=taskId;
  document.getElementById('edit-level').value=item.risk_level||'一般质量缺陷';
  document.getElementById('edit-issue').value=item.issue||'';
  document.getElementById('edit-regulation').value=item.regulation||'';
  document.getElementById('edit-correction').value=item.correction||'';
  openModal('modal-edit');
}
function saveEdit(){
  if(!editingItem) return;
  editingItem.risk_level=document.getElementById('edit-level').value;
  editingItem.issue=document.getElementById('edit-issue').value.trim();
  editingItem.regulation=document.getElementById('edit-regulation').value.trim();
  editingItem.correction=document.getElementById('edit-correction').value.trim();
  closeModal('modal-edit');
  showToast('✓ 已保存');
  if(currentDetailTask) renderDetailContent(currentDetailTask);
  if(currentTab===1) renderSummary();
}
function deleteIssue(item,taskId){
  if(!confirm(`确定删除？\n${(item.issue||'').slice(0,50)}`)) return;
  const task=tasks.find(t=>t.id===taskId);
  if(task?.data) task.data=task.data.filter(x=>x!==item);
  showToast('✓ 已删除');
  if(currentDetailTask?.id===taskId) renderDetailContent(currentDetailTask);
  if(currentTab===1) renderSummary();
}
function copyIssue(item){
  const experts = item._experts && item._experts.length > 0 ? item._experts : (item.category ? [item.category] : []);
  const expertLabel = experts.length > 1 ? `${experts.join('、')}（${experts.length}专家共同确认）` : (experts[0] || '—');
  const corpLines = (item._corpViolations||[]).map(v=>`   🏢 违反企业内规 ${v.id}：${v.content.slice(0,50)}...`).join('\n');
  const text=`【${item.risk_level}】\n专业来源：${expertLabel}\n${item.issue}\n\n📋 规范依据：${item.regulation||'—'}\n✅ 整改措施：${item.correction||'—'}${corpLines?'\n\n'+corpLines:''}`;
  copyText(text);showToast('✓ 已复制');
}
function showIssueDetail(item){
  const st=RISK_STYLE[item.risk_level]||RISK_STYLE['一般质量缺陷'];
  const experts = item._experts && item._experts.length > 0 ? item._experts : (item.category ? [item.category] : []);
  const EXPERT_COLORS = {
    '安全':'#7C3AED','机械':'#1D4ED8','消防':'#B91C1C','土建':'#065F46',
    '机电':'#0369A1','结构':'#9A3412','电气':'#92400E','基坑':'#155E75',
    '边坡':'#14532D','隧洞':'#3B0764','水利':'#1E3A5F','给排水':'#134E4A',
    '环保':'#166534','管道':'#831843'
  };
  const expertTagsHTML = experts.map(exp => {
    const color = EXPERT_COLORS[exp] || '#374151';
    return `<span style="display:inline-flex;align-items:center;background:${color};color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;">${exp}专家</span>`;
  }).join('');
  const multiNote = experts.length > 1
    ? `<div style="background:linear-gradient(90deg,rgba(124,58,237,0.1),rgba(29,78,216,0.1));border:1px solid #7C3AED;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#5B21B6;">🔁 该问题由 <strong>${experts.join('、')}</strong> 共 ${experts.length} 位专家共同识别，置信度更高</div>`
    : '';
  // 企业内规违反详情
  const corpViolations = item._corpViolations || [];
  const corpHTML = corpViolations.length > 0 ? `
    <div style="background:#FEF2F2;border:1.5px solid #DC2626;border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;color:#DC2626;margin-bottom:8px;display:flex;align-items:center;gap:6px">
        🏢 违反企业内部规定（${corpViolations.length}条）
      </div>
      ${corpViolations.map(v => `
        <div style="margin-bottom:8px;padding:8px;background:#fff;border-radius:8px;border:1px solid rgba(220,38,38,0.2)">
          <div style="font-size:11px;font-weight:700;color:#DC2626;margin-bottom:4px">${escHtml(v.id)} · ${escHtml(v.source)}</div>
          <div style="font-size:12px;color:#374151;line-height:1.6">${escHtml(v.content)}</div>
          <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">
            ${v.hitKeywords.map(kw => `<span style="font-size:10px;background:#FEE2E2;color:#DC2626;padding:1px 6px;border-radius:4px">${escHtml(kw)}</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>` : '';

  document.getElementById('modal-detail-content').innerHTML=`
    <div style="background:${st.border};color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:14px">${st.icon} ${item.risk_level}</div>
    ${multiNote}
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${expertTagsHTML}</div>
    ${corpHTML}
    <div class="detail-section"><div class="detail-section-title">📝 问题描述</div><div class="detail-section-body">${escHtml(item.issue||'')}</div></div>
    ${item.regulation?`<div class="detail-section"><div class="detail-section-title">📋 规范依据</div><div class="detail-section-body" style="color:var(--text-secondary)">${escHtml(item.regulation)}</div></div>`:''}
    ${item.correction?`<div class="detail-section"><div class="detail-section-title">✅ 整改措施</div><div class="detail-section-body" style="color:var(--success)">${escHtml(item.correction)}</div></div>`:''}`;
  openModal('modal-detail');
}

function copyAll() {
  const allIssues=[]; const allReview=[];
  const doneTasks=tasks.filter(t=>t.status==='done');
  doneTasks.forEach(t=>{
    (t.data||[]).forEach(iss=>allIssues.push({...iss,_src:t.originalName||t.name,_taskId:t.id,_model:t.analysis_meta?.model||PROVIDERS[config.provider]?.model||'未知'}));
    (t.review_items||[]).forEach(x=>allReview.push({...x,_src:t.originalName||t.name}));
  });
  if(!allIssues.length&&!allReview.length){showToast('暂无可导出的检查结果');return;}
  const sorted=[...allIssues].sort((a,b)=>(RISK_STYLE[a.risk_level]?.priority??9)-(RISK_STYLE[b.risk_level]?.priority??9));
  const now=new Date().toLocaleString('zh-CN');
  const modelLabel=sorted[0]?sorted[0]._model:(PROVIDERS[config.provider]?.model||'未知');
  const lines=['施工现场安全质量检查报告',`检查时间：${now}`,`模型版本：${modelLabel}`,`分析引擎：V5.3-visual-audit-v2`,`已分析图片：${doneTasks.length}张`,`已确认问题：${allIssues.length}项`,`现场复核事项：${allReview.length}项`,'='.repeat(48),''];
  sorted.forEach((iss,i)=>{
    const experts=iss._experts?.length?iss._experts:(iss.category?[iss.category]:[]);
    const rectMap={pending:'待整改',ongoing:'整改中',done:'已完成'};
    const corpNote=(iss._corpViolations||[]).length?`违反企业内规：${(iss._corpViolations||[]).map(v=>v.id).join('、')}`:'';
    lines.push(`${String(i+1).padStart(2,'0')}. ${iss.issue_id||createIssueId(iss)} 【${iss.risk_level}】[${rectMap[iss.rectStatus]||'待整改'}]` ,`来源图片：${iss._src||'—'}`,`问题描述：${iss.issue}`,`证据位置：${iss.evidence_location||'见问题描述'}`,`证据状态：${iss.evidence_status||'照片可直接确认'}`,`专业来源：${experts.join('、')||'综合'}`,`规范依据：${iss.regulation||'需核对现行适用规范'}`,`整改建议：${iss.correction||'请结合现场制定针对性措施'}`,...(corpNote?[corpNote]:[]),'');
  });
  if(allReview.length){
    lines.push('现场复核清单（不代表已确认缺陷）','-'.repeat(48));
    allReview.forEach((x,i)=>lines.push(`${i+1}. [${x.priority||'中'}] ${x.item}`,`来源图片：${x._src||'—'}`,`位置：${x.location||'—'}`,`复核原因：${x.reason||'照片无法确认，建议现场核验'}`,''));
  }
  lines.push('说明：图像识别仅基于照片可见信息；尺寸、功能、隐蔽工程及规范适用性应现场测量/查资料确认。');
  copyText(lines.join('\n'));
  showToast(`✅ 已复制报告：${allIssues.length}项问题、${allReview.length}项复核事项`);
}


function clearAll(){
  if(!tasks.length) return;
  const hasDone=tasks.some(t=>t.status==='done');
  if(hasDone){
    const choice=confirm('清空前是否保存到历史记录？\n\n点击「确定」先存档再清空\n点击「取消」直接清空不保存');
    if(choice){
      saveSessionToHistory().then(()=>{
        _doClearAll();
      });
      return;
    }
  } else {
    if(!confirm('确定要清空所有图片吗？')) return;
  }
  _doClearAll();
}
function _doClearAll(){
  tasks=[];
  _aiQueue.length=0;
  doneAnalyzing=0; totalAnalyzing=0;
  document.getElementById('task-list').innerHTML='';
  setProgress(0,false);
  updateCount();setStatus('就绪');showToast('✓ 队列已清空');
}

function stateCard(icon,title,sub,color){
  return`<div class="state-card"><div class="state-icon">${icon}</div><div class="state-title" style="color:${color}">${escHtml(title)}</div><div class="state-sub">${escHtml(sub)}</div></div>`;
}
function setStatus(text){document.getElementById('status-bar').textContent=text;}
function setProgress(val,visible){
  const bar=document.getElementById('progress-bar');
  bar.style.display=visible?'block':'none';
  document.getElementById('progress-fill').style.width=val+'%';
}

let toastTimeout = null;
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.classList.remove('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      t.textContent = msg;
      t.classList.add('show');
      toastTimeout = setTimeout(() => {
        t.classList.remove('show');
      }, dur);
    });
  });
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);}
}
function escHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ServiceWorker 只在 HTTPS 或 localhost 环境注册，避免 file:// 报错
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').catch(err => console.info('SW注册跳过:', err.message));
}

loadConfig();
updateCount();
</script>
</body>
</html>
